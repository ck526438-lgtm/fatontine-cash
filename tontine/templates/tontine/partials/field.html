<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} span-all{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
  <label class="check-row">{{ field }}<span>{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</span></label>
  {% else %}
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
