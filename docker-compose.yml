services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fatontine
      POSTGRES_USER: fatontine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://fatontine:${POSTGRES_PASSWORD}@db:5432/fatontine
    volumes: [media:/data/private_media, backups:/data/backups]
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [db]
volumes:
  pgdata:
  media:
  backups:
